<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Shockmate — Beat Glitch</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="boom">SHOCK</span><span class="mate">MATE</span></div>
      <div class="hud">
        <div class="stat"><span class="lbl">Won</span><span id="stat-won">0</span></div>
        <div class="stat"><span class="lbl">Criticals</span><span id="stat-crit">0</span></div>
        <div class="stat"><span class="lbl">Cards</span><span id="stat-cards">0</span></div>
      </div>
      <button id="btn-collection" class="ghost">Cards</button>
      <button id="btn-settings" class="ghost">Settings</button>
      <div class="path" id="path"></div>
    </header>
    <section id="screen-title" class="screen active">
      <h1>Beat Glitch.</h1>
      <p class="lead">Glitch dangles bait on every board. Find the move he is scared of.</p>
      <div class="actions" id="profiles">
        <button id="prof-0" class="ghost prof">Player 1</button>
        <button id="prof-1" class="ghost prof">Player 2</button>
      </div>
      <button id="btn-start" class="cta">Play</button>
      <div class="actions">
        <button id="btn-coop" class="ghost">Team up vs Glitch</button>
        <button id="btn-duel" class="ghost">Duel</button>
      </div>
      <p class="hint" id="title-due">Sessions are short on purpose.</p>
    </section>
    <section id="screen-play" class="screen">
      <div class="glitch-row">
        <div id="glitch"></div>
        <div class="bubble" id="glitch-line" hidden></div>
      </div>
      <div class="team" id="team" hidden>
        <div class="turn-chip" id="turn-chip"></div>
        <div class="rage"><b>GLITCH RAGE</b><i><span id="rage-fill"></span></i></div>
      </div>
      <div class="blitz" id="blitz" hidden><i><span id="blitz-fill"></span></i></div>
      <div class="banner" id="banner" hidden></div>
      <div class="board-wrap">
        <div id="board" class="board" aria-label="Chess board"></div>
        <div id="fx" class="fx" aria-hidden="true"></div>
      </div>
      <div class="timelines" id="timelines" hidden>
        <div class="tl you"><b>YOU</b><i><span></span></i></div>
        <div class="tl him"><b>GLITCH</b><i><span></span></i></div>
      </div>
      <div class="prompt" id="prompt">Your move.</div>
      <div class="gate-dots" id="gate-dots"></div>
      <div class="actions">
        <button id="btn-hint" class="ghost">Show the bait</button>
        <button id="btn-skip" class="ghost">Skip</button>
      </div>
    </section>
    <section id="screen-card" class="screen">
      <div class="future-title" id="card-title">Card earned</div>
      <div class="why-card" id="why-card">
        <div class="mascot" id="why-mascot">TWO HEADS</div>
        <p id="why-text"></p>
        <p class="why-long" id="why-long"></p>
        <p class="why-long" id="glitch-line-2"></p>
      </div>
      <div class="actions">
        <button id="btn-next" class="cta">Next fight</button>
        <button id="btn-peek" class="ghost" hidden>Show the biggest one</button>
        <button id="btn-replay" class="ghost">Replay both futures</button>
      </div>
    </section>
    <section id="screen-collection" class="screen">
      <h2>Your cards</h2>
      <p class="sub" id="collection-summary"></p>
      <div id="palace-rooms" class="rooms"></div>
      <div class="actions"><button id="btn-back-play" class="cta">Back</button></div>
    </section>
    <section id="screen-settings" class="screen">
      <h2>Parent settings</h2>
      <label>Player 1 name <input id="opt-name-0" type="text" maxlength="16" /></label>
      <label>Player 2 name <input id="opt-name-1" type="text" maxlength="16" /></label>
      <label>Fights per session <input id="opt-cap" type="number" min="3" max="12" value="6" /></label>
      <label class="check"><input id="opt-sound" type="checkbox" checked /> Sound</label>
      <label class="check"><input id="opt-coords" type="checkbox" /> Coordinates</label>
      <label class="check"><input id="opt-blitz-0" type="checkbox" /> Blitz mode for player 1</label>
      <label class="check"><input id="opt-blitz-1" type="checkbox" /> Blitz mode for player 2</label>
      <label class="check"><input id="opt-hurry" type="checkbox" /> Hurry rematch clock (testing)</label>
      <button id="btn-reset" class="ghost danger">Reset this player</button>
      <button id="btn-close-settings" class="cta">Done</button>
    </section>
    <section id="screen-duel" class="screen">
      <div class="future-title" id="duel-title">Duel result</div>
      <div class="why-card">
        <p id="duel-line"></p>
        <p class="why-long" id="duel-detail"></p>
      </div>
      <div class="actions">
        <button id="btn-duel-next" class="cta">Next board</button>
        <button id="btn-duel-home" class="ghost">Done</button>
      </div>
    </section>
    <div id="toast" class="toast" hidden></div>
    <div id="session-end" class="modal" hidden>
      <div class="modal-card">
        <h2 id="end-title">Mission complete</h2>
        <p id="session-summary"></p>
        <div class="next-peek"><div class="mini" id="next-mini"></div><p class="sub" id="session-next"></p></div>
        <button id="btn-end-ok" class="cta">Done for today</button>
      </div>
    </div>
  </div>
  <script src="encounters.js"></script>
  <script src="futures.js"></script>
  <script src="pieces.js"></script>
  <script src="glitch.js"></script>
  <script src="motifs.js"></script>
  <script src="score.js"></script>
  <script src="game.js"></script>
</body>
</html>
